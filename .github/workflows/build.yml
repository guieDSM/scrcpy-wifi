name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --release --locked

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: scrcpy-wifi-windows
          path: |
            target/release/scrcpy-wifi.exe
            Cargo.lock

      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" target/release/scrcpy-wifi.exe \
            --title "scrcpy Wi-Fi ${GITHUB_REF_NAME}" \
            --notes "Скачайте scrcpy-wifi.exe и запустите. Инструкция — в README."
