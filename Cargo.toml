[package]
name = "scrcpy-wifi"
version = "0.1.1"
edition = "2021"
description = "Android phone screen on Windows over Wi-Fi: a small GUI around scrcpy"

[dependencies]
eframe = { version = "=0.29.1", features = ["persistence"] }
serde = { version = "1", features = ["derive"] }
ureq = "2.10"
sha2 = "0.10"
zip = { version = "2.2", default-features = false, features = ["deflate"] }

[profile.release]
lto = true
codegen-units = 1
strip = true
